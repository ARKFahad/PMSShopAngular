<h1 mat-dialog-title> <strong>Cash Payment</strong></h1>
<div mat-dialog-content>
     <mat-form-field >
          <mat-label>Payable Amount</mat-label>
        <input type="number" placeholder="Payable Amount" matInput [(ngModel)]="data" readonly>
    </mat-form-field>
    <mat-form-field >
         <mat-label>Received Amount</mat-label>
        <input type="text" placeholder="Received Amount" (keyup)="onChangeReceivedAmount()" matInput [(ngModel)]="paymentAmount">
    </mat-form-field>
     <mat-form-field >
          <mat-label>Change Amount</mat-label>
        <input type="number" placeholder="Change Amount" matInput [(ngModel)]="returnAmount" readonly>
    </mat-form-field>
   
</div>
<div mat-dialog-actions>
    <button mat-button mat-flat-button  color="accent" (click)="doAction()">Apply Payment</button>
    <button mat-button (click)="closeDialog()" mat-flat-button color="warn">Cancel</button>
</div>
