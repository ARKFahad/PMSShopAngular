<div class="catalog-card" style="margin-bottom: 0">
  <div>
    <form [formGroup]="searchForm">
      <div class="row">
        <div class="col-md-9 col-xl-9">
          <mat-form-field appearance="outline">
            <mat-label>Filter Products</mat-label>
            <input
              matInput
              placeholder="Search For Products"
              formControlName="keyword"
              type="text"
              autocomplete="off"
            />
          </mat-form-field>
        </div>

        <div
          class="col-sm-12 col-md-3 col-lg-3 col-xl-3"
          style="text-align: right"
        >
          <button
            mat-raised-button
            color="accent"
            style="margin-bottom: 30px !important; width: 100%"
            (click)="resetFilter()"
          >
            <i style="margin-right: 10px" class="fa fa-redo"></i>
            Reload
          </button>
        </div>
      </div>
    </form>
    <div *ngIf="!hasProductsLoaded" style="margin-bottom: 0">
      <app-catalog-skeleton [showImage]="showImage"></app-catalog-skeleton>
    </div>
    <div *ngIf="hasProductsLoaded && products">
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-2">
        <div
          *ngFor="let product of products"
          class="col"
          style="border-radius: 5px"
        >
          <mat-card style="min-height: 150px">
            <div style="min-height: 100px">
              <mat-card-title
                style="
                  font-size: small;
                  font-weight: bold;
                  align-items: center;
                  margin-bottom: 0.7rem;
                "
                >{{ product.productName }}
                <span
                  style="
                    padding: 0px 2px;
                    border: 1px dotted;
                    border-radius: 2px;
                  "
                >
                  {{ product.productPackSize }}
                </span></mat-card-title
              >

              <p style="font-size: smaller">
                <span
                  style="
                    border: 1px solid rgb(7, 194, 100);
                    padding: 0px 4px;
                    border-radius: 12px;
                  "
                  >{{ product.productCategory }}</span
                >
                &nbsp;{{ product.supplierName }}
              </p>
            </div>

            <mat-card-content style="margin: 0; padding: 0 !important">
              <div
                style="
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
                "
              >
                <p style="font-size: medium">
                  {{
                    product.mrp | currency : "BDT" : "symbol-narrow" : "1.0-2"
                  }}
                </p>
                <p
                  style="
                    padding: 1px 4px;
                    border-radius: 4px;
                    /* color: gray; */
                    font-size: smaller;
                  "
                >
                  In Stock: <b>{{ product.quantity }}</b>
                </p>
              </div>
              <!-- <mat-divider></mat-divider> -->
            </mat-card-content>
            <mat-card-actions
              style="
                display: flex;
                justify-content: center;
                margin: 0px !important;
                padding: 0 !important;
              "
            >
              <button
                class="btn"
                style="margin: 0 !important"
                mat-raised-button
                color="accent"
                (click)="addToCart(product)"
              >
                <i style="margin-right: 10px" class="fa fa-cart-plus"></i>
                ADD TO CART
              </button>
            </mat-card-actions>
          </mat-card>
        </div>
      </div>
    </div>
  </div>
</div>
