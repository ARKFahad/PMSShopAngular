<h1 mat-dialog-title> <strong>Customer Payment</strong></h1>
<div mat-dialog-content>
               <div>
                    <h2 style="margin: 0px!important;">{{data.name}}</h2>
                     <!-- <strong>Due:</strong> {{data.balance}} -->
                    <strong>Due:</strong> {{customerBalance}}
                </div>
                  <p></p>
    <mat-form-field appearance="outline">
      <mat-label>Select Payment Method </mat-label>
      <mat-select class="form-select" [(ngModel)]="paymentMethodId">
        <mat-option *ngFor="let set of paymentMethods" [value]="set.id">
          {{ set?.name }}
        </mat-option>
      </mat-select>
      <mat-error> Please select a valid Payment Method </mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline" >
         <mat-label>Payment Amount</mat-label>
        <input type="number" placeholder="Amount" matInput [(ngModel)]="paymentAmount">
        
    </mat-form-field>
   
</div>
<div mat-dialog-actions>
    <button mat-button mat-flat-button  color="accent" (click)="doAction()">Apply Payment</button>
    <button mat-button (click)="closeDialog()" mat-flat-button color="warn">Cancel</button>
</div>
